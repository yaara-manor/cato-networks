[project]
name = "kbindex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "braintrust>=0.43.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
